version: '2'

# Every linter that judges this repository is named here, and `default: none` is
# what makes the roster a decision: a golangci-lint release that adds a linter to
# a preset cannot change a verdict without a line in this file. The version that
# reads it is pinned in the Makefile.
linters:
    default: none
    enable:
        - copyloopvar
        - errcheck
        - errorlint
        - exhaustive
        - gocritic
        - gosec
        - govet
        - ineffassign
        - intrange
        - misspell
        - nilerr
        - perfsprint
        - prealloc
        - revive
        - staticcheck
        - unconvert
        - unused

    settings:
        errcheck:
            # A failed type assertion yields a zero value that reads like data.
            check-type-assertions: true
        exhaustive:
            # A switch that states a default has answered every case it did not name.
            default-signifies-exhaustive: true
        gocritic:
            enabled-tags:
                - diagnostic
                - performance
                - style
            disabled-checks:
                # Bubble Tea's contract is a model passed and returned BY VALUE — the
                # copy is the architecture, not an oversight.
                - hugeParam
                # The registries are value catalogues (Tool, Script, Machine): ranging
                # by index to save a copy trades the loop's meaning for its bytes.
                - rangeValCopy
        gosec:
            excludes:
                # Running a declared command is what this CLI IS: every subprocess comes
                # from the registries under src/internal/config/, never from input.
                - G204
                - G702
                # Same for the paths it reads: they are derived from $HOME and from the
                # registry, and a workstation tool that may not open a computed path
                # cannot report on the machine it runs on.
                - G304
                - G703
        govet:
            enable-all: true
            disable:
                # Struct fields are ordered by meaning; padding is not the constraint of
                # a CLI that holds a few dozen registry entries in memory.
                - fieldalignment
        misspell:
            locale: US
        staticcheck:
            checks:
                - all

    exclusions:
        generated: lax
        rules:
            # `internal/` publishes nothing: a doc comment per exported identifier
            # there documents a package no consumer can import. Package comments are
            # still required — staticcheck's ST1000 asks for them.
            - linters:
                  - revive
              text: '^exported:'

issues:
    # Every finding, every time: a capped report is a gate that hides debt.
    max-issues-per-linter: 0
    max-same-issues: 0
