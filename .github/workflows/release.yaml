name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        uses: jterrazz/studio-actions/.github/workflows/release-go.yaml@main
        with:
            binary-name: workstation
            build-path: ./src/cmd/workstation
            go-version: '1.26'
            targets: 'darwin/arm64,darwin/amd64,linux/arm64,linux/amd64'
