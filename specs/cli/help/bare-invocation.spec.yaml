description: shows the full help banner when no command is given
runs:
    - command: ""
      exit: 0
      stdout: |
          A unified CLI tool for development workflow automation.

          Usage:
            j [command]

          Available Commands:
            clean       Clean system caches, Docker, Multipass, and trash
            config      Configure this machine (interactive TUI)
            install     Install development tools
            machine     Manage and inspect this machine and its services
            remote      Manage remote access connectivity
            run         Run common development commands
            status      Show comprehensive system status
            upgrade     Upgrade system packages

          Flags:
            -h, --help   help for j

          Use "j [command] --help" for more information about a command.
