description: lists the machine subcommands under --help
runs:
    - command: machine --help
      exit: 0
      stdout: |
          Manage and inspect this machine and its services

          Usage:
            j machine [command]

          Available Commands:
            add         Add a machine to the registry
            init        Register this machine in ~/.jterrazz/config.json (interactive)
            list        List registered machines
            probe       Probe a remote machine (ping, ssh, gateway ports, console owner)
            remove      Remove a machine from the registry
            restart     Software-reboot a remote server Mac (FileVault-aware authrestart)
            status      Show machine + service status
            unlock      Unlock a FileVault-protected server Mac over preboot SSH

          Flags:
            -h, --help   help for machine

          Use "j machine [command] --help" for more information about a command.
