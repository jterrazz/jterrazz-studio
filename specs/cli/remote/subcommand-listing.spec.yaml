description: lists the remote access subcommands under --help
runs:
    - command: remote --help
      exit: 0
      stdout: |
          Connect / disconnect / inspect the Tailscale endpoint for remote
          access. To configure the endpoint itself (mode, auth, hostname, secret),
          use `j config` and switch to the Remote tab.

          Usage:
            j remote [flags]
            j remote [command]

          Available Commands:
            down        Disconnect remote access
            status      Show remote access status
            up          Connect remote access

          Flags:
            -h, --help   help for remote

          Use "j remote [command] --help" for more information about a command.
