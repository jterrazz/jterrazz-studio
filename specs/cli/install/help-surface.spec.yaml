description: documents the install command under --help
runs:
    - command: install --help
      exit: 0
      stdout: |
          Install development tools.

          With no arguments and an interactive terminal, opens the install TUI: tools
          are grouped into four pages (Dev, Infra, AI, Apps), each split into family
          sections in registry order. Use arrows/jk to move, tab to fold a section,
          space for details, i to install, u to uninstall (with a confirm prompt),
          1-4 to jump pages, q/esc to quit.

          Falls back to the classic plain-text catalog listing when stdout isn't a
          terminal (scripts, CI, piped output) or when --list is passed.

          Examples:
            workstation install                 Open the interactive install TUI
            workstation install --list          Print the plain-text tool catalog instead
            workstation install homebrew        Install Homebrew
            workstation install nvm             Install NVM
            workstation install go python node  Install specific tools

          Usage:
            workstation install [tool...] [flags]

          Flags:
            -h, --help   help for install
                --list   print the plain-text tool catalog instead of opening the TUI
